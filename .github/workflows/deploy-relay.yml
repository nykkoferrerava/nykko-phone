# Deploys the Pitaka inbox relay (relay/worker.js) to your Cloudflare account.
# Run it from the Actions tab ("Deploy relay" -> Run workflow); it also runs when relay/ changes on main.
# Repository secrets it needs (Settings -> Secrets and variables -> Actions), see docs/SETUP-RELAY.md:
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template, plus D1 Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   RELAY_ADMIN_SECRET     the setup secret Pitaka made for you (16+ characters)
name: Deploy relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/deploy-relay.yml']

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_ADMIN_SECRET: ${{ secrets.RELAY_ADMIN_SECRET }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the repository secrets
        run: |
          missing=0
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RELAY_ADMIN_SECRET; do
            if [ -z "${!s}" ]; then echo "::error::Add the $s repository secret first (docs/SETUP-RELAY.md)."; missing=1; fi
          done
          if [ -n "$RELAY_ADMIN_SECRET" ] && [ ${#RELAY_ADMIN_SECRET} -lt 16 ]; then echo "::error::RELAY_ADMIN_SECRET must be 16 characters or more."; missing=1; fi
          exit $missing

      - name: Install wrangler (pinned)
        run: npm install --no-save --no-audit --no-fund wrangler@4.139.0

      - name: Find or create the D1 database
        run: |
          find_db() {
            npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const d=l.find(x=>x.name==='pitaka-relay');process.stdout.write(d?(d.uuid||d.database_id||''):'')})"
          }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create pitaka-relay
            id=$(find_db)
          fi
          if [ -z "$id" ]; then echo "::error::Couldn't create or find the pitaka-relay D1 database. Check that the API token has D1 Edit."; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          echo "Using D1 database $id"

      - name: Allow your GitHub Pages address
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sed -i "s#^ALLOWED_ORIGIN = .*#ALLOWED_ORIGIN = \"https://$owner.github.io\"#" wrangler.toml
          grep '^ALLOWED_ORIGIN' wrangler.toml

      - name: Deploy the Worker
        run: |
          npx wrangler deploy | tee deploy.log
          echo "RELAY_URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_ENV"

      - name: Set the setup secret
        run: printf '%s' "$RELAY_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET

      - name: Check the relay answers
        run: |
          if [ -z "$RELAY_URL" ]; then echo "::notice::Deployed. Find its address in Cloudflare: Workers & Pages -> pitaka-relay."; exit 0; fi
          sleep 5
          curl -fsS --retry 3 --retry-delay 5 "$RELAY_URL/"; echo
          echo "::notice::Your relay address is $RELAY_URL. In Pitaka open Settings -> Inbox relay and paste it with the setup secret."

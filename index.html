  <!-- Hidden switch: clicking it makes iOS play a light haptic tick (progressive enhancement). -->
  <label id="haptic" class="sr-only" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <header id="topbar" class="topbar"></header>
  <div id="banner-slot"></div>
  <main id="main"></main>

  <nav class="tabbar" aria-label="Sections">
    <div class="tabs">
      <button type="button" data-action="tab" data-tab="home"><svg class="ti" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button>
      <button type="button" data-action="tab" data-tab="debts"><svg class="ti" aria-hidden="true"><use href="#i-card"/></svg><span>Debts</span></button>
      <button type="button" data-action="tab" data-tab="plan"><svg class="ti" aria-hidden="true"><use href="#i-target"/></svg><span>Plan</span></button>
      <button type="button" data-action="tab" data-tab="reports"><svg class="ti" aria-hidden="true"><use href="#i-chart"/></svg><span>Reports</span></button>
    </div>
    <button type="button" class="fab" data-action="add" aria-label="Add entry"><svg class="ti" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </nav>

  <div id="sheet" hidden></div>
  <div id="toast" role="status" hidden></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>

  <section id="onboard" class="overlay" hidden></section>
  <section id="install" class="overlay" hidden></section>

  <section id="lock" class="overlay" hidden>
    <div class="lock-inner">
      <div class="logo" aria-hidden="true">₱</div>
      <h2 id="lock-title">Enter PIN</h2>
      <div id="lock-dots" class="dots" role="img" aria-label="0 of 4 digits entered"></div>
      <p id="lock-err" class="critical-text" role="alert"></p>
      <div class="keypad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <span></span><button type="button" data-k="0">0</button><button type="button" data-k="del" class="key-del" aria-label="Delete"><svg class="ti" aria-hidden="true"><use href="#i-delete"/></svg></button>
      </div>
      <button type="button" id="lock-cancel" class="link">Cancel</button>
      <button type="button" id="lock-forgot" class="link">Forgot PIN?</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
